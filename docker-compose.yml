services:
  frontend:
    build:
      context: ./has-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./has-backend
    # Not published to the host: the frontend nginx proxies /api/ to backend:8080
    # over the compose network, so the browser only ever talks to the frontend.
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/has
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${PASSWORD}
      - VPN_SERVER_ENDPOINT=${VPN_SERVER_ENDPOINT:?set VPN_SERVER_ENDPOINT in .env}
      - VPN_MANAGER_TOKEN=${VPN_MANAGER_TOKEN:?set VPN_MANAGER_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - database

  database:
    image: postgres:15-alpine
    # Deliberately not published to the host: the backend reaches it internally
    # as jdbc:postgresql://database:5432/has over the compose network.
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=has

  adminer:
    image: adminer:latest
    # Admin-only DB UI: bound to loopback so it is reachable from the host
    # (e.g. via SSH tunnel) but never from the LAN or the game network.
    ports:
      - "127.0.0.1:${ADMINER_PORT}:8080"
    depends_on:
      - database

  wireguard-server:
    build:
      context: ./has-vpn
    ports:
      - "${WIREGUARD_PORT}:51820/udp"
      # the VPN manager API (9999) is deliberately not published: only the
      # backend calls it, over the internal compose network
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
      - SERVERURL=wireguard-server
      - SERVERPORT=${WIREGUARD_PORT}
      # Must be set, or the image runs as a client. 0 means no pre-made peers:
      # the backend registers every player itself, and pre-made peers would
      # take the same 10.8.19.x addresses.
      - PEERS=0
      - PEERDNS=8.8.8.8
      - INTERNAL_SUBNET=10.8.19.0/24
      - VPN_MANAGER_TOKEN=${VPN_MANAGER_TOKEN:?set VPN_MANAGER_TOKEN in .env}
      # - ALLOWEDIPS=10.8.19.0/24 
    volumes:
      - ./config/server:/config
  # for now there is no need for a network we just use the default
  #networks:
  #  network:
  #    driver: bridge
