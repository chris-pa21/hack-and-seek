plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'Diplo1.0'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
	// Docker-Java 3.7.0 (defaults to Docker API 1.44+)
	implementation 'com.github.docker-java:docker-java-api:3.7.0'
	implementation 'com.github.docker-java:docker-java-core:3.7.0'
	implementation 'com.github.docker-java:docker-java-transport-httpclient5:3.7.0'

	// Monitoring
	implementation 'io.micrometer:micrometer-registry-prometheus'

    // Utils
    implementation 'org.modelmapper:modelmapper:3.1.1'

    // .env file support
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
