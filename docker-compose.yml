services:
  frontend:
    build:
      context: ./has-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    #environment:
    networks:
      network:
        ipv4_address: 172.16.8.5

  backend:
    build:
      context: ./has-backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
    networks:
      network:
        ipv4_address: 172.16.8.10

  db:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=has
    networks:
      network:
        ipv4_address: 172.16.8.20

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
    depends_on:
      - db

networks:
  network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.8.0/24
