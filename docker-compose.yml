networks:
  frontend:
    build:
      context: ./has-frontend
    ports:
      - "80:${FRONTEND_PORT}"
    networks:
      network:
        ipv4_address: 172.16.3.5

  backend:
    build:
      context: ./has-backend
    ports:
      - "8080:${BACKEND_PORT}"
    networks:
      network:
        ipv4_address: 172.16.3.10

network:
  driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.3.0/24
