# outsource just this as environment variables

# Docker Compose env vars override these when running in Docker.
spring.datasource.url=jdbc:postgresql://localhost:5432/has
spring.datasource.username=postgres
spring.datasource.password=${env.PASSWORD}

# Shared secret with the VPN manager. No default on purpose: the backend
# refuses to start without it. Docker Compose passes VPN_MANAGER_TOKEN.
vpn.manager.token=${env.VPN_MANAGER_TOKEN}

# Host and port players' WireGuard clients connect to, written into every
# client config. Required like the token. The server's public key is not
# configured: VpnService reads it from the running WireGuard interface.
vpn.server.endpoint=${env.VPN_SERVER_ENDPOINT}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=604800
