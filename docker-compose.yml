services:
  frontend:
    build:
      context: ./has-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./has-backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/has
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${PASSWORD}
      - VPN_SERVER_PUBLIC_KEY=${VPN_SERVER_PUBLIC_KEY}
      - VPN_SERVER_ENDPOINT=${VPN_SERVER_ENDPOINT}
      - VPN_MANAGER_TOKEN=${VPN_MANAGER_TOKEN:?set VPN_MANAGER_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - database

  database:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=has

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - database

  wireguard-server:
    build:
      context: ./has-vpn
    ports:
      - "${WIREGUARD_PORT}:51820/udp"
      # the VPN manager API (9999) is deliberately not published: only the
      # backend calls it, over the internal compose network
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
      - SERVERURL=wireguard-server
      - SERVERPORT=${WIREGUARD_PORT}
      - PEERS=2
      - PEERDNS=8.8.8.8
      - INTERNAL_SUBNET=10.8.19.0/24
      - VPN_MANAGER_TOKEN=${VPN_MANAGER_TOKEN:?set VPN_MANAGER_TOKEN in .env}
      # - ALLOWEDIPS=10.8.19.0/24 
    volumes:
      - ./config/server:/config
  # for now there is no need for a network we just use the default
  #networks:
  #  network:
  #    driver: bridge
