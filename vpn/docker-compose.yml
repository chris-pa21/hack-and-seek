# 2025-11-18

services:
  wireguard-server:
    container_name: wireguard-server
    image: lscr.io/linuxserver/wireguard:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
      - SERVERURL=wireguard-server
      - SERVERPORT=51820
      - PEERS=2
      - PEERDNS=8.8.8.8
      - INTERNAL_SUBNET=10.8.19.0/24
    volumes:
      - ./config/server:/config
    ports:
      - "51820:51820/udp"

  wg-client-1:
    container_name: wg-client-1
    image: linuxserver/wireguard
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./config/client1:/config
    depends_on:
      - wireguard-server

  wg-client-2:
    container_name: wg-client-2
    image: linuxserver/wireguard
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./config/client2:/config
    depends_on:
      - wireguard-server
