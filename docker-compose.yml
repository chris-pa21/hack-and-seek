networks:
  frontend:
    build:
      context: ./has-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      network:
        ipv4_address: 172.16.3.5

  backend:
    build:
      context: ./has-backend
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      network:
        ipv4_address: 172.16.3.10

  db:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      network:
        ipv4_address: 172.16.3.20

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db

network:
  driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.3.0/24
